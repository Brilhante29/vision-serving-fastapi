id: 7
name: vision-serving-fastapi
program:
  id: applied-computer-vision
  narrative_fit: Consumes the checkpoint contract produced by #1 and proves verified CPU model serving through HTTP and Prometheus.
  shared_assets:
    - vision model artifact schema
    - checkpoint SHA-256 contract
    - warmed per-image inference protocol
    - HTTP throughput and p95 benchmark
status: benchmarked
claim: Loads a provenance-checked YOLO checkpoint and measures real FastAPI inference throughput without network or credentials.
stack:
  - python-3.12.13
  - fastapi-0.116.1
  - ultralytics-8.4.96
  - pytorch-2.13.0-cpu
  - prometheus-client-0.22.1
  - httpx-0.28.1
  - docker
language_profile:
  primary: fastapi-backend
  secondary: [python-ml]
  reason: FastAPI owns HTTP while the native Ultralytics adapter consumes the artifact emitted by the training repository.
decision_brain:
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: artifact-contract-reused
  principles:
    coupling_rule: HTTP and metrics depend on the model prediction contract; checkpoint verification and Ultralytics loading remain in the adapter.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: One model, one process, three endpoints, and one measured CPU profile.
    testability_rule: Unit tests inject a fake model; Docker alone proves the real checkpoint and framework integration.
    rejected_overengineering: [grpc, kafka, rabbitmq, redis, database, cloud, dynamic-batching]
  stack_profile: fastapi-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: docker
    real_provider_target: none
    adapter_rule: No cloud behavior exists; Kumo becomes relevant only if an object-storage contract is introduced.
  database: none
  runtime: Non-root FastAPI and Ultralytics CPU container with no runtime network.
  library_policy: Use FastAPI for HTTP, Prometheus client for wire-compatible metrics, Httpx for measured requests, and the exact Ultralytics version that produced the checkpoint.
  record_path: sdd/technical-decision.md
architecture:
  style: modular-monolith
  reason: One deployment owns model startup, bounded image decoding, synchronous CPU inference, telemetry, and benchmark execution.
  dependency_rule: Transport composes a model contract; tests replace it without importing or executing Ultralytics.
  boundaries:
    - checkpoint manifest and SHA-256 gate
    - Ultralytics inference adapter
    - FastAPI transport and bounded decoder
    - Prometheus telemetry
    - HTTP load benchmark
model_artifact:
  role: consumer
  producer: Brilhante29/yolo-training-pipeline
  schema_version: 1
  manifest_path: models/model-manifest.json
  checkpoint_path: models/best.pt
  checkpoint_sha256: 41598b005401dab39969719bf0678b55415121911fa72c110b21b75bab9c2e96
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [programs, decision-brain, architecture, fastapi-backend, python-computer-vision, design-system, sdd, benchmark-contract, skills]
benchmark:
  primary_metric: throughput_rps
  unit: req/s
  command: docker run --rm --network none vision-serving-fastapi benchmark --num-requests 20 --concurrency 1 --warmup-requests 3 --output /tmp/benchmark.json
  result_path: benchmarks/results/benchmark.json
  evidence_status: current
release:
  docker: docker run --rm -p 8000:8000 vision-serving-fastapi
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
