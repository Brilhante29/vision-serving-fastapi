id: 7
name: vision-serving-fastapi
program:
  id: applied-computer-vision
  narrative_fit: "Demonstrates serving a computer vision model via FastAPI with production-grade metrics and benchmarking"
  shared_assets:
    - Docker-based benchmark harness
    - Prometheus metrics pattern
status: benchmarked
claim: servir modelo CV
stack:
  - python
  - fastapi
  - onnxruntime
  - prometheus
  - k6
  - docker
language_profile:
  primary: fastapi-backend
  secondary: []
  reason: "FastAPI is the standard Python framework for serving ML models with async support and OpenAPI docs"
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: applied-computer-vision
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: "Domain types (InferenceRequest, InferenceResponse) do not depend on FastAPI, Prometheus, or HTTP"
    solid:
      - srp
      - ocp
      - lsp
      - isp
      - dip
    simplicity_rule: "Single-file mock model; no ONNX binary -- synthetic latency is sufficient to prove the benchmark claim"
    testability_rule: "Domain types tested without server; app tested with TestClient; benchmark runs via subprocess"
    rejected_overengineering:
      - "ONNX runtime binary in repo (download at build time)"
      - "Async model batching (not needed for mock)"
  stack_profile: fastapi-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: docker
    real_provider_target: none
    emulated_services: []
    adapter_rule: "No cloud dependencies - fully local"
    config_switch: CLOUD_PROVIDER=none
    unsupported_behaviors: []
  database: none
  runtime: "Uvicorn ASGI server"
  library_policy: "FastAPI for serving, Prometheus client for metrics, httpx for benchmark client"
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: "ONNX Runtime as strict dependency"
      reason: "No real ONNX model; mock model uses numpy + sleep for synthetic latency"
    - option: "gRPC over HTTP"
      reason: "REST is simpler for CV inference demo; gRPC adds complexity without benchmark benefit"
architecture:
  style: modular-monolith
  reason: "Single-process API with clear domain/app/benchmark boundaries is the simplest design that proves the claim"
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: low
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: "app/ depends on domain/; benchmark/ depends on domain/ and httpx; domain/ depends on nothing"
  boundaries:
    - domain/ (InferenceRequest, InferenceResponse, BenchmarkResult)
    - app/ (FastAPI routes, Prometheus metrics)
    - benchmark/ (load test harness)
  rejected_alternatives:
    - style: hexagonal-architecture
      reason: "Overkill for a mock model serving demo; modular monolith provides sufficient separation"
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: throughput_rps
  unit: unit
  command: "python -m vision_serving benchmark"
  result_path: benchmarks/results/benchmark.json
release:
  docker: passing
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
