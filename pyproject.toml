[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-serving-fastapi"
version = "0.2.0"
description = "FastAPI serving and load benchmark for a provenance-checked YOLO artifact."
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==2.4.4",
  "pillow==12.2.0",
  "prometheus-client==0.22.1",
  "python-multipart==0.0.20",
  "ultralytics==8.4.96",
  "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
