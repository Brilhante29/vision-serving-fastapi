name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked test and validation dependencies
        run: |
          pip install -r requirements-test.lock
          pip install -r requirements-validation.lock
          pip install --no-build-isolation --no-deps -e .
      - name: Run unit and contract tests
        run: pytest tests -q
      - name: Validate benchmark and publication provenance
        run: |
          python tools/validate-benchmark.py
          python tools/validate_publication.py --require-git
      - name: Validate portfolio project
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build pinned serving image
        run: docker build -t vision-serving-fastapi:ci .
      - name: Run real YOLO HTTP benchmark offline
        run: >-
          docker run --rm --network none vision-serving-fastapi:ci
          benchmark --num-requests 20 --concurrency 1 --warmup-requests 3
          --output /tmp/benchmark.json
